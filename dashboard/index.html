<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 현황</title>
<!--
  팀 대시보드 (보기 전용)
  - data.json : 깃허브 Actions 가 만든 레포 현황 (커밋 · 이슈 · PR)
  - config.json : 제목 · 링크 · 기준 시간 설정
  이 화면은 두 파일을 1분마다 다시 읽어 그리기만 한다. 깃허브에 직접 묻거나 무엇을 바꾸지 않는다.
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #dde1e8;
    --on: #1f9d57; --off: #98a1b0; --warn: #d9822b; --link: #2456c9; --tag: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --card: #1d222b; --text: #e7eaf0; --muted: #98a2b3; --line: #2f3643;
      --on: #3ecf7f; --off: #6b7482; --warn: #f0a04b; --link: #8fb0ff; --tag: #2a313d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 26px 0 10px; }
  h2 small, .muted { color: var(--muted); font-size: 13px; font-weight: 400; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--text); }
  .row { display: grid; gap: 12px; }
  .stats { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .members { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 28px; line-height: 1.2; }
  .todo { border-left: 4px solid var(--warn); }
  .todo.clear { border-left-color: var(--on); }
  .list > div { padding: 8px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .list > div:first-child { padding-top: 0; }
  .list > div:last-child { border-bottom: 0; padding-bottom: 0; }
  .scroll { max-height: 340px; overflow-y: auto; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--on); } .dot.off { background: var(--off); } .dot.warn { background: var(--warn); }
  .msg { margin: 4px 0; overflow-wrap: anywhere; }
  .tag { background: var(--tag); border-radius: 6px; padding: 1px 7px; font-size: 12px; margin-left: 4px; white-space: nowrap; }
  .error { border-left: 4px solid var(--warn); margin-bottom: 12px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title">팀 현황</h1>
      <div class="muted" id="updated">불러오는 중…</div>
    </div>
    <nav class="links" id="links"></nav>
  </header>

  <div id="error"></div>

  <section class="row stats" id="stats"></section>

  <h2>① 지금 처리할 일 <small>PO · 누구든 메울 수 있는 빈자리</small></h2>
  <section class="card todo list" id="todo"></section>

  <h2>② 팀원 <small id="member-rule"></small></h2>
  <section class="row members" id="members"></section>

  <div class="row two">
    <div>
      <h2 id="issues-title">③ 열린 이슈</h2>
      <section class="card list scroll" id="issues"></section>
    </div>
    <div>
      <h2 id="pulls-title">④ 열린 PR</h2>
      <section class="card list scroll" id="pulls"></section>
      <h2>⑤ 최근 활동</h2>
      <section class="card list scroll" id="activity"></section>
    </div>
  </div>

  <footer>보기 전용 화면입니다. 푸시 · 이슈 · PR 이 생기면 1분쯤 뒤에 반영돼요.</footer>
</main>

<script>
// ───────── 설정 기본값 (config.json 이 없거나 일부만 있어도 동작하게) ─────────
const DEFAULTS = { title: "팀 현황", links: [], working_hours: 1, quiet_hours: 24, pr_wait_hours: 3 };
const REFRESH_MS = 60 * 1000; // 1분마다 다시 읽는다

// ───────── 작은 도우미들 ─────────
// 화면 조각을 만든다. 글자는 항상 textContent 로 넣어서, 이슈 제목에 이상한 코드가 들어 있어도 실행되지 않는다.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
// 링크를 만든다. http(s) 로 시작하는 주소만 링크로 만들고, 아니면 그냥 글자로 둔다.
function link(text, url) {
  if (typeof url !== "string" || !/^https?:\/\//i.test(url)) return el("span", "", text);
  const a = el("a", "", text);
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function hoursSince(iso) { return (Date.now() - new Date(iso).getTime()) / 3600000; }
// "12분 전", "3시간 전", "2일 전" 처럼 바꾼다
function ago(iso) {
  const minutes = Math.max(0, Math.floor(hoursSince(iso) * 60));
  if (minutes < 60) return minutes + "분 전";
  if (minutes < 60 * 24) return Math.floor(minutes / 60) + "시간 전";
  return Math.floor(minutes / (60 * 24)) + "일 전";
}
// "3시간째", "2일째" 처럼 바꾼다
function forHowLong(iso) {
  const hours = hoursSince(iso);
  return hours < 24 ? Math.floor(hours) + "시간째" : Math.floor(hours / 24) + "일째";
}
function clock(date) { return date.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false }); }
function dayClock(iso) {
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + clock(d);
}
function fill(id, nodes, emptyText) {
  const box = document.getElementById(id);
  box.replaceChildren();
  if (!nodes.length) box.append(el("div", "muted", emptyText));
  else nodes.forEach(n => box.append(n));
}

// ───────── 팀원 상태 정하기 ─────────
// 작업 중: 최근 working_hours 시간 안에 커밋 / 조용함: quiet_hours 넘게 커밋 없음 / 그 사이는 쉬는 중
function memberState(member, cfg) {
  const last = member.last_commit;
  if (!last) return { dot: "warn", label: "커밋 없음", quiet: true };
  const hours = hoursSince(last.when);
  if (hours <= cfg.working_hours) return { dot: "on", label: "작업 중", quiet: false };
  if (hours > cfg.quiet_hours) return { dot: "warn", label: forHowLong(last.when) + " 조용함", quiet: true };
  return { dot: "off", label: "쉬는 중", quiet: false };
}

// ───────── 그리기 ─────────
function render(data, cfg) {
  const members = data.members || [], issues = data.issues || [], pulls = data.pulls || [], activity = data.activity || [];
  const states = members.map(m => memberState(m, cfg));

  // 머리말
  document.getElementById("title").textContent = cfg.title;
  document.title = cfg.title;
  document.getElementById("updated").textContent =
    "데이터 기준 " + dayClock(data.generated_at) + " · 화면 갱신 " + clock(new Date()) + " · 1분마다 자동 갱신";
  const links = document.getElementById("links");
  links.replaceChildren();
  (cfg.links || []).forEach(item => links.append(link(item.label, item.url)));
  document.getElementById("member-rule").textContent = "작업 중 = 최근 " + cfg.working_hours + "시간 안에 커밋";

  // 요약 숫자
  const unassigned = issues.filter(i => !i.assignees.length);
  const stats = [
    [members.length, "팀원"],
    [states.filter(s => s.label === "작업 중").length, "지금 작업 중"],
    [issues.length, "열린 이슈"],
    [pulls.length, "열린 PR"],
    [unassigned.length, "담당자 없는 이슈"],
  ];
  fill("stats", stats.map(([number, label]) => {
    const card = el("div", "card stat");
    card.append(el("b", "", String(number)), document.createTextNode(label));
    return card;
  }), "");

  // ① 지금 처리할 일
  const todo = [];
  if (unassigned.length) {
    const row = el("div");
    row.append(el("b", "", "담당자 없는 이슈 " + unassigned.length + "개"), document.createTextNode(" — "));
    unassigned.slice(0, 5).forEach((issue, index) => {
      if (index) row.append(document.createTextNode(", "));
      row.append(link("#" + issue.number + " " + issue.title, issue.url));
    });
    if (unassigned.length > 5) row.append(document.createTextNode(" 외 " + (unassigned.length - 5) + "개"));
    todo.push(row);
  }
  pulls.filter(p => !p.draft).forEach(pull => {
    const waiting = hoursSince(pull.created_at) > cfg.pr_wait_hours;
    const noReviewer = !pull.reviewers.length;
    if (!waiting && !noReviewer) return;
    const reasons = [];
    if (noReviewer) reasons.push("리뷰어 없음");
    if (waiting) reasons.push("올린 지 " + ago(pull.created_at).replace(" 전", ""));
    const row = el("div");
    row.append(el("b", "", "PR 확인 필요"), document.createTextNode(" — "), link("#" + pull.number + " " + pull.title, pull.url),
      document.createTextNode(" · " + pull.author + " · " + reasons.join(" · ")));
    todo.push(row);
  });
  members.forEach((member, index) => {
    if (!states[index].quiet || !member.open_issues) return;
    const row = el("div");
    row.append(el("b", "", "오래 조용한 팀원"), document.createTextNode(" — " + member.login + " (" + states[index].label +
      ") · 열린 이슈 " + member.open_issues + "개를 맡고 있어요"));
    todo.push(row);
  });
  document.getElementById("todo").classList.toggle("clear", !todo.length);
  fill("todo", todo, "지금 처리할 일이 없어요.");

  // ② 팀원 카드
  fill("members", members.map((member, index) => {
    const state = states[index], last = member.last_commit, card = el("div", "card");
    const top = el("div");
    top.append(el("span", "dot " + state.dot), el("b", "", member.login), document.createTextNode(" · " + state.label));
    card.append(top);
    if (last) {
      card.append(el("div", "muted", "마지막 커밋 " + ago(last.when) + " · " + last.branch));
      const message = el("div", "msg");
      message.append(link(last.message, last.url));
      card.append(message);
    } else {
      card.append(el("div", "muted", "아직 커밋이 없어요"));
    }
    card.append(el("div", "muted", "열린 이슈 " + member.open_issues + " · 열린 PR " + member.open_pulls));
    return card;
  }), "아직 팀원이 없어요. 커밋하거나 이슈를 배정받으면 여기에 나타나요.");
  if (!members.length) document.getElementById("members").firstChild.className = "card muted";

  // ③ 열린 이슈
  document.getElementById("issues-title").textContent = "③ 열린 이슈 " + issues.length;
  fill("issues", issues.map(issue => {
    const row = el("div");
    row.append(link("#" + issue.number + " " + issue.title, issue.url));
    issue.labels.forEach(label => row.append(el("span", "tag", label)));
    row.append(el("div", "muted", (issue.assignees.length ? "담당: " + issue.assignees.join(", ") : "담당자 없음") + " · " + ago(issue.created_at)));
    return row;
  }), "열린 이슈가 없어요.");

  // ④ 열린 PR
  document.getElementById("pulls-title").textContent = "④ 열린 PR " + pulls.length;
  fill("pulls", pulls.map(pull => {
    const row = el("div");
    row.append(link("#" + pull.number + " " + pull.title, pull.url));
    if (pull.draft) row.append(el("span", "tag", "초안"));
    row.append(el("div", "muted", pull.author + " · " + pull.head + " → " + pull.base + " · " +
      (pull.reviewers.length ? "리뷰어: " + pull.reviewers.join(", ") : "리뷰어 없음") + " · " + ago(pull.created_at)));
    return row;
  }), "열린 PR 이 없어요.");

  // ⑤ 최근 활동
  const kinds = { commit: "커밋", issue: "이슈 열음", pull: "PR 열음" };
  fill("activity", activity.map(item => {
    const row = el("div");
    row.append(el("span", "muted", dayClock(item.when) + " "), el("b", "", item.who), document.createTextNode(" " + (kinds[item.type] || "") + " "),
      link(item.text, item.url));
    return row;
  }), "아직 활동이 없어요.");
}

// ───────── 불러오기 ─────────
// 주소 뒤에 시각을 붙여서, 브라우저가 예전에 받아 둔 파일 대신 새 파일을 받게 한다.
async function getJson(name) {
  const response = await fetch(name + "?t=" + Date.now(), { cache: "no-store" });
  if (!response.ok) throw new Error(name + " 을 읽지 못했어요 (" + response.status + ")");
  return response.json();
}
let lastData = null, lastConfig = DEFAULTS;
async function load() {
  const errorBox = document.getElementById("error");
  try {
    const config = await getJson("config.json").catch(() => ({})); // 설정 파일은 없어도 기본값으로 동작
    lastConfig = Object.assign({}, DEFAULTS, config);
    lastData = await getJson("data.json");
    errorBox.replaceChildren();
  } catch (error) {
    // 새 데이터를 못 받으면 이유를 보여 주고, 전에 받은 데이터가 있으면 그대로 둔다
    errorBox.replaceChildren(el("div", "card error", "데이터를 새로 받지 못했어요. " + error.message));
  }
  if (lastData) render(lastData, lastConfig);
  else document.getElementById("updated").textContent = "아직 데이터가 없어요.";
}
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
